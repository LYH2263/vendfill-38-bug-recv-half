services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendfill
      POSTGRES_PASSWORD: vendfill
      POSTGRES_DB: vendfill
    ports: ["5449:5432"]
    volumes: [vendfill_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendfill -d vendfill"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://vendfill:vendfill@db:5432/vendfill
      SEED_ON_EMPTY: "true"
    ports: ["9800:9800"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["4800:80"]
    depends_on: [api]
volumes:
  vendfill_pg:
